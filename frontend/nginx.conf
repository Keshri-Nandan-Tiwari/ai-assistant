server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend through this same domain, so cookies
    # set by the backend are "first-party" from the browser's point of view.
    # Without this, the frontend and backend being on different subdomains
    # makes auth cookies "third-party", which browsers increasingly block
    # by default — most aggressively in private/incognito browsing.
    location /api/ {
        proxy_pass https://ai-assistant-backend-jwas.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host ai-assistant-backend-jwas.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffering off; # needed so streamed chat responses aren't buffered/delayed
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
