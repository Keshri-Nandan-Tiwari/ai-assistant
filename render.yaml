services:
  # --- Backend API (Docker, runs Prisma migrations on boot via docker-entrypoint.sh) ---
  - type: web
    name: ai-assistant-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # paste your free Neon (neon.tech) Postgres connection string here
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: 30
      - key: APP_URL
        sync: false # set to your frontend's Render URL after first deploy
      - key: API_URL
        sync: false # set to this service's own Render URL after first deploy
      - key: ALLOWED_ORIGINS
        sync: false # set to your frontend's Render URL
      - key: COOKIE_DOMAIN
        sync: false # leave blank unless using a custom domain
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: OPENAI_MODEL_BALANCED
        value: openai/gpt-oss-120b
      - key: OPENAI_MODEL_ADVANCED
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false # your free Groq API key goes here (console.groq.com/keys)
      - key: ANTHROPIC_API_KEY
        sync: false # optional — leave unset if you're not using Anthropic
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: no-reply@yourapp.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: ./uploads

  # --- Frontend (static build served via Docker+nginx) ---
  - type: web
    name: ai-assistant-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false # set to your backend's Render URL, e.g. https://ai-assistant-backend.onrender.com
